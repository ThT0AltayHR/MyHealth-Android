name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Kararli surum olarak GitHub Release'e yukle"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ---- Kalici imza anahtari -------------------------------------------------
      # 1) KEYSTORE_BASE64 secret'i varsa onu kullanir (en saglam yol).
      # 2) Yoksa anahtari bir kez uretir ve actions/cache ile saklar; boylece
      #    her derleme AYNI anahtarla imzalanir ve APK ustune guncellenebilir.
      - name: Restore signing key from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "SIGNING_SOURCE=secret" >> "$GITHUB_ENV"
          else
            echo "SIGNING_SOURCE=cache" >> "$GITHUB_ENV"
          fi

      - name: Restore signing key from cache
        if: env.SIGNING_SOURCE == 'cache'
        uses: actions/cache@v4
        with:
          path: release.keystore
          key: myhealth-release-keystore-v1

      - name: Create signing key if missing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ ! -f release.keystore ]; then
            SP="${KEYSTORE_PASSWORD:-myhealth-ci}"
            KA="${KEY_ALIAS:-myhealth}"
            keytool -genkeypair -keystore release.keystore -alias "$KA" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$SP" -keypass "$SP" \
              -dname "CN=MyHealth, OU=Mobile, O=MyHealth, L=Istanbul, C=TR"
            echo "Yeni imza anahtari uretildi."
          else
            echo "Mevcut imza anahtari kullaniliyor (${SIGNING_SOURCE})."
          fi

      # ---- Derleme -------------------------------------------------------------
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            G=./gradlew
          else
            G=gradle
          fi
          $G assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify APK signature and name the file
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$AS" verify --verbose --print-certs "$APK" | head -n 12
          cp "$APK" "MyHealth-v1.0.${{ github.run_number }}.apk"
          {
            echo "### MyHealth v1.0.${{ github.run_number }}"
            echo "- Imza kaynagi: \`${SIGNING_SOURCE}\`"
            if [ "${SIGNING_SOURCE}" = "cache" ]; then
              echo "- Anahtar GitHub onbelleginde tutuluyor. Kalici olmasi icin README'deki"
              echo "  'Kalici imza anahtari' bolumunu izleyip 4 secret ekleyin."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyHealth-Release-APK
          path: MyHealth-v*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: MyHealth ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: MyHealth-v*.apk
          generate_release_notes: true
